name: ci

# 存储仓的门禁，形状与 moon-s3／moon-kodo 那两条一致。
#
# 这一步以前是"把三个仓拉到同一条流水里现生成跨仓工作区"，因为 platform-s3／platform-qiniu 引的两个
# SDK 还没进注册表，pin 装不到东西。2026-10-18 两条 SDK 各发了 v0.1.0，本机现读 `moon install` 已经从
# 注册表取到 mldong/moon-s3@0.1.0 与 mldong/moon-kodo@0.1.0 ⇒ 切换回"只跑本仓"：档位数字是本仓的 56，
# 不再是整树的 164。两侧读数都记在台账与 README 的验收口径里。
#
# 这条 CI 刻意不带任何凭据（MinIO／七牛真桶／FTP 都不给），所以 5 条 live 腿必然响亮 SKIP：
# 4 条平台腿（local／s3／qiniu／ftp 各一）＋1 档契约的 acl:true。条数被断言钉死成恰好 5——
# 少一条就是有人把某档偷偷接上了，多一条是夹具掉了，两种都要红。真端点那档只在本机带凭据跑，
# 别把这里的绿读成"六条腿都验过"。
#
# 用例条数断言不许删：wasm-gc 那档会静默丢掉异步用例而退出码仍为 0，条数是"真跑过"的唯一证据。
# 条数与改动同笔更新；对不上先现读再改，严禁拿删断言变绿。

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Check / Build / Test (wasm + native)
    runs-on: ubuntu-latest
    env:
      EXPECTED_TESTS: "56"
      EXPECTED_SKIPS: "5"
    steps:
      - uses: actions/checkout@v4

      - name: Install MoonBit toolchain (latest)
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: Toolchain version
        run: |
          moon version --all
          moon update

      - name: Check
        run: moon check --target wasm --no-render

      - name: Build
        run: |
          moon build --target wasm --no-render
          moon build --target native --no-render

      - name: Test
        run: |
          # pipefail 不许省：GH 默认只给 -e，`moon test | tee` 的退出码是 tee 的 0，
          # 真红的用例会被这条管道吃掉、只剩"Total tests" 那半句自证过关。
          # 判据因此打全串（passed 与 failed 都钉住），不认"总条数对得上"。
          set -o pipefail
          moon test --target wasm -j 1 --no-render | tee wasm-test.txt
          moon test --target native -j 1 --no-render | tee native-test.txt
          for f in wasm-test.txt native-test.txt; do
            grep -q "Total tests: $EXPECTED_TESTS, passed: $EXPECTED_TESTS, failed: 0" "$f"
            skips=$(grep -c "SKIP IS NOT A PASS" "$f" || true)
            echo "$f：$EXPECTED_TESTS 条全绿已核，SKIP 行数=$skips（CI 无凭据，应为 $EXPECTED_SKIPS）"
            test "$skips" = "$EXPECTED_SKIPS"
          done
          {
            echo "这轮**没有**跑到的 $EXPECTED_SKIPS 条 live 腿（CI 刻意不带凭据）："
            grep "^SKIP IS NOT A PASS" wasm-test.txt | sort | uniq -c
          } >> "$GITHUB_STEP_SUMMARY"

      - name: README snippet check
        run: |
          export MOON_HOME="$HOME/.moon"
          bash scripts/readme-check.sh

      - name: Generated interface is up to date
        run: |
          moon info --target wasm
          git diff --exit-code -- '*pkg.generated.mbti'

      - name: Formatting
        run: moon fmt --check

      - name: Assert zero warnings
        run: |
          moon check --target wasm --no-render 2>&1 | tee check.txt
          ! grep -q "Warning" check.txt
