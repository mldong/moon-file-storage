name: ci

# 存储仓的门禁，形状与 moon-s3／moon-kodo 那两条一致。
#
# 这一步以前是"把三个仓拉到同一条流水里现生成跨仓工作区"，因为 platform-s3／platform-qiniu 引的两个
# SDK 还没进注册表，pin 装不到东西。2026-10-18 两条 SDK 各发了 v0.1.0，本机现读 `moon install` 已经从
# 注册表取到 mldong/moon-s3@0.1.0 与 mldong/moon-kodo@0.1.0 ⇒ 切换回"只跑本仓"：档位数字是本仓的 56，
# 不再是整树的 164。两侧读数都记在台账与 README 的验收口径里。
#
# 这条 CI 刻意不带任何凭据（MinIO／七牛真桶／FTP 都不给），所以 5 条 live 腿必然响亮 SKIP：
# 4 条平台腿（local／s3／qiniu／ftp 各一）＋1 档契约的 acl:true。条数被断言钉死成恰好 5——
# 少一条就是有人把某档偷偷接上了，多一条是夹具掉了，两种都要红。真端点那档只在本机带凭据跑，
# 别把这里的绿读成"六条腿都验过"。
#
# 用例条数断言不许删：wasm-gc 那档会静默丢掉异步用例而退出码仍为 0，条数是"真跑过"的唯一证据。
# 条数与改动同笔更新；对不上先现读再改，严禁拿删断言变绿。

on:
  push:
    branches: [master]
    tags: ['v*.*.*']
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: "检查全绿后是否发布七个模块到 mooncakes（tag 触发默认发布；手动触发需显式勾选）"
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Check / Build / Test (wasm + native)
    runs-on: ubuntu-latest
    env:
      # 现读，不是推算：从仓根跑 `moon test --target wasm -j 1 --no-render`（不带凭据）量出来的
      # 两条数——第八件 OSS 那代替是 68／6，加上 platform-cos 的离线 12 档与第九条腿各一档之后
      # 是 81／7。这条线再加腿时要重新跑一遍再改，别照着上一行加。
      EXPECTED_TESTS: "81"
      EXPECTED_SKIPS: "7"
    steps:
      - uses: actions/checkout@v4

      - name: Install MoonBit toolchain (latest)
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH

      - name: Toolchain version
        run: |
          moon version --all
          moon update

      - name: Check
        run: moon check --target wasm --no-render

      - name: Build
        run: |
          moon build --target wasm --no-render
          moon build --target native --no-render

      - name: Test
        run: |
          # pipefail 不许省：GH 默认只给 -e，`moon test | tee` 的退出码是 tee 的 0，
          # 真红的用例会被这条管道吃掉、只剩"Total tests" 那半句自证过关。
          # 判据因此打全串（passed 与 failed 都钉住），不认"总条数对得上"。
          set -o pipefail
          moon test --target wasm -j 1 --no-render | tee wasm-test.txt
          moon test --target native -j 1 --no-render | tee native-test.txt
          for f in wasm-test.txt native-test.txt; do
            grep -q "Total tests: $EXPECTED_TESTS, passed: $EXPECTED_TESTS, failed: 0" "$f"
            skips=$(grep -c "SKIP IS NOT A PASS" "$f" || true)
            echo "$f：$EXPECTED_TESTS 条全绿已核，SKIP 行数=$skips（CI 无凭据，应为 $EXPECTED_SKIPS）"
            test "$skips" = "$EXPECTED_SKIPS"
          done
          {
            echo "这轮**没有**跑到的 $EXPECTED_SKIPS 条 live 腿（CI 刻意不带凭据）："
            grep "^SKIP IS NOT A PASS" wasm-test.txt | sort | uniq -c
          } >> "$GITHUB_STEP_SUMMARY"

      - name: README snippet check
        run: |
          export MOON_HOME="$HOME/.moon"
          bash scripts/readme-check.sh

      - name: Generated interface is up to date
        run: |
          moon info --target wasm
          git diff --exit-code -- '*pkg.generated.mbti'

      - name: Formatting
        run: moon fmt --check

      - name: Assert zero warnings
        run: |
          moon check --target wasm --no-render 2>&1 | tee check.txt
          ! grep -q "Warning" check.txt

  publish:
    name: Publish the modules to mooncakes
    needs: verify
    # 判据是单数 'tag'：写成 'tags' 会让 tag 推送的整个 publish job 被 skip，而 workflow 结论
    # 照旧 success（moon-token 的 v0.1.7 就是这么静默漏发过一次）。下面第一步把三个值打进 log。
    if: github.ref_type == 'tag' || (github.event_name == 'workflow_dispatch' && inputs.publish)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: What triggered this publish
        env:
          PUBLISH_INPUT: ${{ inputs.publish }}
        run: |
          echo "event_name=$GITHUB_EVENT_NAME ref=$GITHUB_REF ref_type=$GITHUB_REF_TYPE"
          echo "publish input=$PUBLISH_INPUT"
          for m in core recorder-file platform-local platform-s3 platform-qiniu platform-ftp platform-oss platform-cos verify; do
            echo "  $m = $(sed -nE 's/^version = "([^"]+)".*/\1/p' "$m/moon.mod" | head -1)"
          done

      - name: Install MoonBit toolchain (latest)
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> $GITHUB_PATH
          "$HOME/.moon/bin/moon" version

      - name: Preflight credentials present (values never printed)
        env:
          MOON_TOKEN: ${{ secrets.MOON_TOKEN }}
          MOON_USERNAME: ${{ secrets.MOON_USERNAME }}
        run: |
          [ -n "$MOON_TOKEN" ] || {
            echo "::error::secrets.MOON_TOKEN 没到位（org mldong 的 secret 需把本仓放进可见范围）"
            exit 1
          }
          [ -n "$MOON_USERNAME" ] || { echo "::error::secrets.MOON_USERNAME 没到位"; exit 1; }
          echo "凭证到位：token 长度 ${#MOON_TOKEN}（值不外泄），用户名 $MOON_USERNAME"

      - name: Write mooncakes credentials
        env:
          MOON_TOKEN: ${{ secrets.MOON_TOKEN }}
          MOON_USERNAME: ${{ secrets.MOON_USERNAME }}
        run: |
          mkdir -p "$HOME/.moon"
          printf '{"token":"%s","username":"%s"}\n' "$MOON_TOKEN" "$MOON_USERNAME" \
            > "$HOME/.moon/credentials.json"

      - name: Update index and install dependencies
        run: |
          moon update
          moon install

      # 拓扑序，不是随手排的：后六件都 pin 门面 `mldong/moon-file-storage`，verify 又 pin 前面全部
      # 六件（外加注册表上的 moon-s3／moon-kodo）。`moon publish` 的包体校验要**从注册表**解析这些
      # 依赖，所以必须先发被依赖的那件；顺序错了会 "no version satisfies" 卡死，而那一件其实已发上去
      # ——所以每一步都可重入（publish-if-absent.sh：每步前 moon update，已在注册表即跳过，
      # 发完一律回查索引复核，CLI 退出码分不清"没发上"与"上传之后环节报错"）。
      # examples 不发布：它是可执行示例，没有消费方，发出去只会多一个没人 import 的包。
      - name: Publish core (mldong/moon-file-storage)
        run: bash .github/scripts/publish-if-absent.sh core mldong/moon-file-storage

      - name: Publish recorder-file
        run: bash .github/scripts/publish-if-absent.sh recorder-file mldong/moon-file-storage-recorder-file

      - name: Publish platform-local
        run: bash .github/scripts/publish-if-absent.sh platform-local mldong/moon-file-storage-local

      - name: Publish platform-s3
        run: bash .github/scripts/publish-if-absent.sh platform-s3 mldong/moon-file-storage-s3

      - name: Publish platform-qiniu
        run: bash .github/scripts/publish-if-absent.sh platform-qiniu mldong/moon-file-storage-qiniu

      # FTP 这条的进度表状态是"载体库未满足接入条件"，但包本身可发：pin 的是注册表上的
      # PaiGack/ftp，消费方装得到、也能照 verify 的契约自己写腿；不发它反而让 verify 的依赖闭包缺角。
      - name: Publish platform-ftp
        run: bash .github/scripts/publish-if-absent.sh platform-ftp mldong/moon-file-storage-ftp

      - name: Publish platform-oss
        run: bash .github/scripts/publish-if-absent.sh platform-oss mldong/moon-file-storage-oss

      - name: Publish platform-cos
        run: bash .github/scripts/publish-if-absent.sh platform-cos mldong/moon-file-storage-cos

      # 顺序是硬的：verify 的 moon.mod 里 pin 着每一块适配层，发布自检**从注册表**解析它们，
      # 所以适配层必须先进注册表，verify 才发得出去——platform-cos 排在 verify 前面是这条规矩，
      # 不是排版。
      - name: Publish verify (contract suite)
        run: bash .github/scripts/publish-if-absent.sh verify mldong/moon-file-storage-verify

      # 用户那条腿：只认"装得到"。空工程逐个 `moon add`（不给版本号⇒由注册表解析），
      # 再把 pin 打进 log，最后拿刚装上的那份真编译真跑一条纯函数断言。
      # 为什么不用 `import { "..." }`：这个版本的 moon.mod 拒绝无版本号的 registry 依赖。
      - name: Consumer leg — install every module from the registry and run one
        run: |
          export MOON_HOME="$HOME/.moon"
          moon update
          probe="$RUNNER_TEMP/consumer-storage"
          rm -rf "$probe"; mkdir -p "$probe/lib"
          printf 'name = "mldong/consumer_probe_storage"\nversion = "0.0.0"\npreferred_target = "wasm"\n' > "$probe/moon.mod"
          printf 'import {\n  "mldong/moon-file-storage/model" @model,\n}\n' > "$probe/lib/moon.pkg"
          printf 'test "the just-published facade installs and works" {\n  assert_eq(@model.object_key("uploads/", "a.txt"), "uploads/a.txt")\n}\n' > "$probe/lib/probe_test.mbt"
          cd "$probe"
          for m in mldong/moon-file-storage \
                   mldong/moon-file-storage-recorder-file \
                   mldong/moon-file-storage-local \
                   mldong/moon-file-storage-s3 \
                   mldong/moon-file-storage-qiniu \
                   mldong/moon-file-storage-ftp \
                   mldong/moon-file-storage-oss \
                   mldong/moon-file-storage-cos \
                   mldong/moon-file-storage-verify; do
            a=1
            until moon add "$m"; do
              if [ "$a" -ge 3 ]; then
                echo "::error::连试 3 次都从注册表装不到 $m —— 这次是真没装得到"
                exit 1
              fi
              a=$((a + 1)); moon update >/dev/null 2>&1 || true; sleep 20
            done
            echo "$m 安装所用尝试次数：$a / 3" >> "$GITHUB_STEP_SUMMARY"
          done
          echo "解析到的 pin：" >> "$GITHUB_STEP_SUMMARY"
          # 取不含用户名的片段：`mldong` 正是 MOON_USERNAME 这个 secret，GH 会在日志里把它遮成
          # ***，用整串正则回读要么被遮要么抄回来就是坏模式（moon-s3 那条就因此恒空过）。
          grep -oE 'moon-file-storage[a-z-]*@[0-9.]+' moon.mod | sed 's/^/  /' \
            | tee -a "$GITHUB_STEP_SUMMARY"
          moon test --target wasm --no-render
